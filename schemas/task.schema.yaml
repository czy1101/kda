# KDA Task Contract, version 1.
#
# Machine-readable form of the contract defined in docs/agent-flow.md.
# A task workspace stores exactly one instance at .kernelpilot/task.yaml.
#
# This schema describes WHAT the task is. It must not describe HOW to optimize:
# tiling, data layout, warp stalls, profiler interpretation, and DSL-specific
# advice belong in a Skill, not in the task contract.

$schema: "https://json-schema.org/draft/2020-12/schema"
title: KDA Task Contract
version: 1
type: object
additionalProperties: false
required:
  - version
  - task
  - target
  - implementation
  - correctness
  - benchmark
  - baseline
  - goal
properties:

  version:
    type: integer
    const: 1

  task:
    type: object
    additionalProperties: false
    required: [name, description]
    properties:
      name:
        type: string
        description: Short identifier, for example "flash-kda".
      description:
        type: string
        description: One-line statement of the goal.

  target:
    type: object
    additionalProperties: false
    required: [backend, device]
    properties:
      backend:
        type: string
        description: Execution backend, for example "cuda", "gcu", "ascend", "kunlun".
      device:
        type: string
        description: Device name, for example "H100", "B200".
      arch:
        type: string
        description: Architecture, for example "sm90", "sm100".
      profile:
        type: string
        pattern: "^[a-z0-9][a-z0-9-]*$"
        description: Optional backend profile id. When omitted, exactly one matching profile is selected automatically; ambiguous matches require user selection.
      language:
        type: string
        description: Kernel language or DSL, for example "triton", "cuda", or "tilelang".

  execution:
    type: object
    additionalProperties: false
    description: Where contracted commands run. Codex always stays on the controller.
    required: [transport]
    properties:
      transport:
        type: string
        enum: [local, ssh]
        default: local
      host:
        type: string
        pattern: "^[A-Za-z0-9_.@-]+$"
        description: SSH host or configured alias. Required when transport is ssh.
      workspace:
        type: string
        pattern: "^/"
        description: Absolute remote repository path. Required when transport is ssh.

  environment:
    type: object
    additionalProperties: false
    description: Reproducible shell setup and an optional cheap environment check.
    properties:
      shell:
        type: string
        default: bash
        description: Shell used with `-lc` for all contracted commands.
      setup:
        type: string
        description: >
          Shell snippet run before correctness, benchmark, profile, and
          preflight commands. Use this for conda activation and required
          environment variables; an interpreter path alone may not reproduce
          dynamic-library settings.
      preflight:
        type: object
        additionalProperties: false
        required: [command]
        properties:
          command:
            type: string
            description: Cheap command that confirms the expected runtime and device.
          expect_stdout_contains:
            type: string
            description: Text that must appear in preflight stdout.

  implementation:
    type: object
    additionalProperties: false
    required: [path]
    properties:
      path:
        type: string
        description: Repository-relative path of the file the agent may modify.
      entrypoint:
        type: string
        description: Symbol or module the implementation is entered through.

  reference:
    type: object
    additionalProperties: false
    properties:
      path:
        type: string
        description: Repository-relative path of the reference implementation. Never modified.

  correctness:
    type: object
    additionalProperties: false
    required: [command]
    properties:
      command:
        type: string
        description: Command that proves correctness.
      required:
        type: boolean
        default: true
        description: When true, a candidate that does not pass must be rejected.

  benchmark:
    type: object
    additionalProperties: false
    required: [command]
    properties:
      command:
        type: string
        description: Command that measures the target metric.
      result_path:
        type: string
        default: runs/benchmark.csv
        description: Task-relative CSV under runs/ or outputs/ on the execution host; bound runs require run_id and candidate columns.
      warmup:
        type: integer
        minimum: 0
        description: Warmup iterations, when the harness takes them as arguments.
      repeat:
        type: integer
        minimum: 1
        description: Measured repetitions, when the harness takes them as arguments.
      shapes:
        type: array
        items:
          type: string
        description: Shapes that must be covered by the measurement.

  measurement:
    type: object
    additionalProperties: false
    description: Optional strict measurement evidence policy; requires repeated baseline and interleaved confirmation before promotion.
    required: [conditions, process_repeats, min_samples, max_relative_mad, min_improvement, confirmation_pairs, guard_command, samples_path]
    properties:
      conditions:
        type: object
        additionalProperties: false
        required: [warmup, iterations, timing_scope, timer, input_id]
        properties:
          warmup: {type: integer, minimum: 0}
          iterations: {type: integer, minimum: 1}
          timing_scope: {type: string, minLength: 1}
          timer: {type: string, minLength: 1}
          input_id: {type: string, minLength: 1}
      process_repeats: {type: integer, minimum: 2}
      min_samples: {type: integer, minimum: 3}
      max_relative_mad: {type: number, minimum: 0, exclusiveMaximum: 1}
      min_improvement: {type: number, minimum: 0, exclusiveMaximum: 1}
      confirmation_pairs: {type: integer, minimum: 2}
      guard_command:
        type: string
        minLength: 1
        description: Backend/task-provided idle and stable environment identity check returning JSON.
      samples_path:
        type: string
        pattern: '^(runs|outputs)/'
        description: Raw sample JSON artifact on the execution host.

  generalization:
    type: object
    additionalProperties: false
    description: Optional guard against benchmark-specific specialization.
    properties:
      allow_shape_specialization:
        type: boolean
        default: false
        description: >
          Whether shape-dependent implementation logic is permitted. Even when
          true it needs an algorithmic justification rather than exact benchmark values.
      command:
        type: string
        description: Optional correctness/performance command covering generalization cases.
      guard_shapes:
        type: array
        items: {type: string}
        description: Additional boundary or held-out shapes used as a generalization guard.
      max_regression:
        type: number
        minimum: 0
        description: Maximum tolerated relative regression on guard shapes.

  baseline:
    type: object
    additionalProperties: false
    required: [name]
    properties:
      name:
        type: string
        description: >
          Selected performance comparator, for example "original" or
          "reference". This choice is fixed before optimization begins.
      role:
        type: string
        enum: [initial_implementation, external_reference]
        description: Strict measurement requires initial_implementation; external reference results do not replace the original baseline.
      command:
        type: string
        description: Command that measures the baseline. Must be reproducible.

  profile:
    type: object
    additionalProperties: false
    properties:
      adapter:
        type: string
        enum:
        - metax
        description: Built-in source-bound collection and normalized export, instead of
          a raw command.
      workload_command:
        type: string
      guard_command:
        type: string
        description: 'Read-only JSON guard: idle true and a stable nonempty environment_id.'
      metrics:
        type: array
        minItems: 1
        items:
          type: string
      kernel_names:
        type: array
        items:
          type: string
      counts:
        type: integer
        minimum: 1
      start_from_api:
        type: boolean
      capture_range:
        type: object
        additionalProperties: false
        required: [start_api, stop_api]
        properties:
          start_api: {type: string, minLength: 1}
          stop_api: {type: string, minLength: 1}
        description: One explicit API-delimited trace range; reject missing markers or crossing/uncorrelated kernels.
      timestamp_unit:
        type: string
        enum:
        - ns
        description: Required for mcTracer; installed 3.7.2 MCPTI timestamps are ns, never
          Chrome default us.
      timeout_seconds:
        type: integer
        minimum: 1
      max_artifact_bytes:
        type: integer
        minimum: 1
      runtime_environment:
        type: object
        additionalProperties:
          type: string
        description: Environment overrides for the profiled child only, not global installation.
      tool:
        type: string
        description: Profiler id or "auto" for live backend-aware discovery.
      command:
        type: string
        description: Explicit profiling command. When absent, profiling is at the agent's discretion.
      candidate_command:
        type: string
        description: Command that captures a profile for the current candidate.
      reference_command:
        type: string
        description: Command that captures a comparable profile for the reference.
      export_command:
        type: string
        description: Deterministic command that exports a profiler report to structured text or CSV.
      low_level_commands:
        type: object
        additionalProperties:
          type: string
        description: Commands that capture named IR or instruction artifacts such as PTX or SASS.
      tools:
        type: object
        description: Optional capture/export commands keyed by discovered tool id.
        additionalProperties:
          type: object
          additionalProperties: false
          properties:
            adapter:
              type: string
              enum:
              - metax
              description: Built-in source-bound collection and normalized export, instead of
                a raw command.
            workload_command:
              type: string
            guard_command:
              type: string
              description: 'Read-only JSON guard: idle true and a stable nonempty environment_id.'
            metrics:
              type: array
              minItems: 1
              items:
                type: string
            kernel_names:
              type: array
              items:
                type: string
            counts:
              type: integer
              minimum: 1
            start_from_api:
              type: boolean
            capture_range:
              type: object
              additionalProperties: false
              required: [start_api, stop_api]
              properties:
                start_api: {type: string, minLength: 1}
                stop_api: {type: string, minLength: 1}
              description: One explicit API-delimited trace range; reject missing markers or crossing/uncorrelated kernels.
            timestamp_unit:
              type: string
              enum:
              - ns
              description: Required for mcTracer; installed 3.7.2 MCPTI timestamps are ns, never
                Chrome default us.
            timeout_seconds:
              type: integer
              minimum: 1
            max_artifact_bytes:
              type: integer
              minimum: 1
            runtime_environment:
              type: object
              additionalProperties:
                type: string
              description: Environment overrides for the profiled child only, not global installation.
            command:
              type: string
            candidate_command:
              type: string
            reference_command:
              type: string
            export_command:
              type: string
            low_level_commands:
              type: object
              additionalProperties:
                type: string

  analysis:
    type: object
    additionalProperties: false
    description: Per-task policy for capability-driven performance analysis.
    properties:
      hypotheses:
        type: string
        enum: [optional, required]
        default: optional
        description: Require a pre-registered mechanism hypothesis and source-bound assessment before candidate timing; never replaces promotion gates.
      compiler:
        type: object
        additionalProperties: false
        required: [probe, guard_command, workloads]
        properties:
          probe:
            type: string
            description: Protected executor Python probe; runner injects kda_compiler export helpers.
          guard_command:
            type: string
            description: Return idle boolean and stable environment_id JSON before and after capture.
          adapter:
            type: string
            enum: [generic, metax-triton]
            default: generic
          max_artifact_bytes:
            type: integer
            minimum: 1
            default: 67108864
          workloads:
            type: array
            minItems: 1
            uniqueItems: true
            items:
              type: string
              minLength: 1
      tool_discovery:
        type: string
        enum: [auto, disabled, required]
        default: auto
        description: Probe backend-declared analysis tools in the exact task environment.
      preferred_tools:
        type: array
        items:
          type: string
        default: []
        description: Optional task-specific ordering among tools that pass discovery.
      profiling:
        type: string
        enum: [auto, disabled, required]
        default: auto
      reference_profile_comparison:
        type: string
        enum: [auto, disabled, required]
        default: auto
      low_level_artifacts:
        type: string
        enum: [auto, disabled, required]
        default: auto
      ai_profile_fallback:
        type: boolean
        default: true
      extensions:
        type: object
        additionalProperties:
          type: string
          enum: [auto, disabled, required]

  extension_config:
    type: object
    additionalProperties: false
    description: Task-local checks for optional optimization extensions.
    properties:
      tle:
        type: object
        additionalProperties: false
        properties:
          wiki_path:
            type: string
            default: tle-wiki
            description: Project-relative directory containing the task's TLE Wiki.
          api_probe_command:
            type: string
            description: Read-only API probe derived from the installed TLE Wiki/version.

  goal:
    type: object
    additionalProperties: false
    required: [metric]
    oneOf:
      - required: [relative_to_baseline]
        not:
          required: [target_value]
      - required: [target_value]
        not:
          required: [relative_to_baseline]
    properties:
      metric:
        type: string
        description: Measured quantity, for example "latency".
      direction:
        type: string
        enum: [minimize, maximize]
        default: minimize
        description: Whether a smaller or larger metric value is better.
      aggregation:
        type: string
        enum: [sum_ratio, mean_ratio, geomean_ratio, all, any]
        default: sum_ratio
        description: >
          How required shapes are combined for promotion. `all` requires every
          shape to satisfy the relative target; `any` requires at least one
          shape to satisfy it. For an absolute target, sum/mean/geomean ratio
          modes aggregate raw metric values with the corresponding operation.
          The task chooses this policy explicitly.
      max_regression:
        type: number
        minimum: 0
        description: Maximum tolerated relative regression on any required shape.
      relative_to_baseline:
        type: number
        exclusiveMinimum: 0
        description: Ratio of the goal to the baseline. 1.0 means "no change", 0.95 means "5% better than baseline".
      target_value:
        type: number
        description: Absolute target, used instead of relative_to_baseline when the target is a fixed number.

  constraints:
    type: object
    additionalProperties: false
    properties:
      preserve_api:
        type: boolean
        default: true
      preserve_correctness:
        type: boolean
        default: true
      allowed_paths:
        type: array
        items:
          type: string
        description: Implementation sources the agent may modify. Evidence files under docs/, runs/, outputs/, and profile/ are always permitted.
      forbidden_paths:
        type: array
        items:
          type: string
        description: Paths the agent must not modify, typically the reference and the test and benchmark scripts.

  stop:
    type: object
    additionalProperties: false
    properties:
      max_candidates:
        type: integer
        minimum: 1
        description: Hard limit on implemented candidates.
      max_profile_runs:
        type: integer
        minimum: 0
        description: Hard limit on profiling runs, because profiling is expensive.
      no_improvement_rounds:
        type: integer
        minimum: 1
        description: After this many candidates without beating the best, re-diagnose the bottleneck before continuing.
      target_reached:
        type: boolean
        default: true
        description: When true, reaching the goal ends the task.
      reference_parity_tolerance:
        type: number
        minimum: 0
        description: >
          Acceptable relative gap to a reference at which further optimization
          may stop without claiming that the target was reached.
      allow_no_actionable_bottleneck_exit:
        type: boolean
        default: true
        description: Allow an evidence-backed stop when no safe, testable optimization remains.
      allow_backend_capability_exhausted_exit:
        type: boolean
        default: true
        description: Allow an evidence-backed stop when backend analysis capabilities are exhausted.
