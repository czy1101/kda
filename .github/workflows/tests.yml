name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          # Backend profiles reference the KernelWiki and ncu-report-skill
          # skills, so contract validation needs the pinned submodules.
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml jsonschema
      - name: Run the test suite
        run: python -m pytest tests -q
      - name: Verify the knowledge indexes are fresh
        run: python scripts/knowledge_index.py --check
