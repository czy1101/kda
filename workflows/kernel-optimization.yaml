# Declarative definition of the KDA kernel optimization loop.
#
# This file is read by the agent. KernelPilot automates environment setup,
# local/SSH dispatch, synchronization, and evidence gates; the agent still owns
# diagnosis and candidate selection.
#
# Principles: ../AGENTS.md
# Underlying loop: ../docs/agent-flow.md
# Contract: ../schemas/task.schema.yaml, instantiated at .kernelpilot/task.yaml
# Candidate record: ../schemas/candidate.schema.json
# Tool discovery evidence: ../schemas/analysis-capabilities.schema.json
# TLE assessment evidence: ../schemas/tle-assessment.schema.json

name: kernel-optimization
version: 1

inputs:
  task_contract: .kernelpilot/task.yaml

evidence:
  draft: docs/draft.md
  plan: docs/plan.md
  final_report: docs/final-report.md
  workflow_state: runs/workflow-state.json
  stage_events: runs/stage-events.jsonl
  candidates: runs/candidates.jsonl
  benchmark: runs/benchmark.csv
  profile: profile/
  analysis_strategy: runs/analysis-strategy.json
  analysis_capabilities: runs/analysis-capabilities.json
  candidate_profile: profile/candidate/
  reference_profile: profile/reference/
  profile_analysis: profile/analysis.md
  profile_comparison: profile/comparison.md
  low_level_analysis: profile/low-level-analysis.md
  extension_analysis: docs/extension-analysis.md
  tle_assessment: runs/tle-assessment.json

stages:

  - id: init
    action: validate_task
    next: select_backend

  - id: select_backend
    action: load_explicit_or_unique_matching_backend_profile_and_stage_skills
    next: prepare_execution

  - id: prepare_execution
    action: validate_environment_and_materialize_allowed_source
    next: discover_analysis_tools

  # Probe only tools declared by the selected backend profile. Probes run in
  # the exact local/SSH task environment and are recorded as evidence. Missing
  # optional tools are a fallback condition, not a reason to install software.
  - id: discover_analysis_tools
    action: probe_backend_declared_analysis_tools
    on_complete: resolve_optional_extensions
    on_no_tool_available: resolve_optional_extensions
    on_disabled: resolve_optional_extensions
    on_fail: resolve_optional_extensions

  # Optional extensions are decided before optimization. TLE is disabled by
  # default; disabled tasks do not inspect its Wiki, probe its API, or load its
  # skill. Enabling it does not guarantee that it is usable.
  - id: resolve_optional_extensions
    action: resolve_task_extension_policy
    on_none_enabled: inspect
    on_tle_requested: validate_tle
    on_error: workflow_error

  - id: validate_tle
    action: verify_tle_wiki_and_api_in_task_environment
    on_available: inspect
    on_disabled: inspect
    on_optional_unavailable: inspect
    on_required_unavailable: finalize_without_target
    on_error: workflow_error

  - id: inspect
    action: inspect_kernel_and_write_draft_and_plan
    next: correctness

  - id: correctness
    action: run_correctness
    on_pass: baseline
    on_fail: finalize_without_target

  - id: baseline
    action: run_configured_baseline_or_use_benchmark_provided_baseline_and_record
    next: benchmark

  - id: benchmark
    action: benchmark_candidate
    next: evaluate

  - id: evaluate
    action: evaluate_target
    on_target_reached: promote
    on_target_not_reached: diagnose

  # Benchmark runs every round. Expensive or backend-specific analysis is
  # selected only when existing evidence does not justify the next candidate.
  - id: diagnose
    action: diagnose_bottleneck
    on_known_cause: select_optimization_strategy
    on_unknown_cause: select_analysis_strategy
    on_reference_parity: finalize_without_target
    on_no_actionable_bottleneck: finalize_without_target
    on_backend_capability_exhausted: finalize_without_target

  - id: select_analysis_strategy
    action: select_capability_driven_analysis_strategy
    on_discover_tools: discover_analysis_tools
    on_profile_compare: profile_candidate
    on_profile_candidate: profile_candidate
    on_profile_tool_needs_configuration: configure_profile_tool
    on_benchmark_only: benchmark_driven_analysis
    on_error: workflow_error

  - id: configure_profile_tool
    action: materialize_task_scoped_profile_commands_for_selected_tool
    on_configured: profile_candidate
    on_unsafe_or_unsupported: benchmark_driven_analysis
    on_fail: benchmark_driven_analysis

  - id: profile_candidate
    action: capture_and_export_candidate_profile_with_selected_tool
    on_reference_enabled: profile_reference
    on_candidate_only: analyze_profile_reports
    on_fail: benchmark_driven_analysis

  - id: profile_reference
    action: capture_and_export_reference_profile
    on_pass: analyze_profile_reports
    on_fail: analyze_profile_reports

  - id: analyze_profile_reports
    action: analyze_profile_reports_with_routed_skills
    on_complete: analyze_low_level_artifacts
    on_skill_unavailable: analyze_profile_reports_with_ai
    on_inconclusive: analyze_profile_reports_with_ai
    on_reference_parity: finalize_without_target

  # AI fallback consumes structured exports, not an opaque binary profiler
  # report. When both reports exist it compares candidate and reference under
  # the same inputs and execution conditions.
  - id: analyze_profile_reports_with_ai
    action: analyze_structured_profile_reports_directly
    on_complete: analyze_low_level_artifacts
    on_reference_parity: finalize_without_target
    on_no_actionable_bottleneck: finalize_without_target

  - id: analyze_low_level_artifacts
    action: compare_available_ir_ptx_and_machine_instructions
    on_complete: select_optimization_strategy
    on_unavailable: select_optimization_strategy
    on_no_actionable_bottleneck: finalize_without_target
    on_error: workflow_error

  # Non-NVIDIA and limited-tool backends retain the common optimization loop
  # and use the evidence their backend profile declares as available.
  - id: benchmark_driven_analysis
    action: diagnose_from_source_benchmark_and_available_backend_evidence
    on_known_cause: select_optimization_strategy
    on_no_actionable_bottleneck: finalize_without_target
    on_backend_capability_exhausted: finalize_without_target

  - id: select_optimization_strategy
    action: select_available_optimization_extension_from_validated_assessment
    on_extension_available: optimize_with_extension
    on_no_safe_optimization: finalize_without_target
    otherwise: optimize

  # TLE is optional. Use it only when the task requested it and the recorded
  # assessment confirms both the project Wiki and API are available.
  - id: optimize_with_extension
    action: implement_candidate_with_selected_extension
    on_candidate_ready: deploy_candidate
    on_optional_extension_failure: optimize
    on_required_extension_failure: finalize_without_target

  - id: optimize
    action: implement_candidate
    next: deploy_candidate

  - id: deploy_candidate
    action: synchronize_allowed_candidate
    on_pass: correctness_candidate
    on_fail: reject_candidate

  - id: correctness_candidate
    action: run_correctness
    on_pass: benchmark_candidate
    on_fail: reject_candidate

  - id: benchmark_candidate
    action: benchmark_candidate
    next: compare_candidate

  - id: compare_candidate
    action: compare_to_best
    on_improved: generalization_check
    on_neutral: reject_candidate
    on_regressed: reject_candidate

  - id: generalization_check
    action: validate_candidate_generalization
    on_pass: keep_candidate
    on_not_configured: keep_candidate
    on_overfitting_risk: reject_candidate
    on_fail: reject_candidate

  - id: keep_candidate
    action: record_candidate_and_save_best_checkpoint
    next: evaluate

  - id: reject_candidate
    action: record_rejected_candidate_with_reason
    on_continue: restore_best
    on_required_extension_failure: finalize_without_target

  - id: restore_best
    action: restore_best_correct_candidate
    on_pass: check_stop
    on_fail: workflow_error

  # Stop conditions come from the task contract's `stop` block: candidate
  # budget, profiling budget, and repeated rounds without improvement.
  - id: check_stop
    action: evaluate_stop_conditions
    on_target_reached: promote
    on_reference_parity: finalize_without_target
    on_no_actionable_bottleneck: finalize_without_target
    on_backend_capability_exhausted: finalize_without_target
    on_candidate_budget_exhausted: finalize_without_target
    on_profile_budget_exhausted: finalize_without_target
    on_repeated_no_improvement: diagnose
    otherwise: diagnose

  # Target-not-reached is a valid terminal outcome when the reason is supported
  # by evidence. Restore the best correct implementation and report the gap;
  # never relabel this outcome as a successful promotion.
  - id: finalize_without_target
    action: restore_best_and_record_stop_reason
    next: report

  - id: promote
    action: verify_scope_goal_and_evidence
    next: report

  - id: report
    action: generate_final_report
    terminal: true

  - id: workflow_error
    action: record_workflow_error_restore_best_and_exit
    next: report
