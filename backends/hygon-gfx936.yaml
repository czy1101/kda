version: 1
id: hygon-gfx936

match:
  backend: hygon
  arches: [gfx936]
  devices: [BW, Hygon]
  languages: [triton, hip]

skills:
  always: []
  when_discovering:
    - skills/backend-profiler-discovery
  when_profiling:
    - skills/hygon-profile

analysis_tools:
  # Probes search the DTK layout instead of assuming one image-specific root:
  # a bare-metal host and a container often install the same toolkit under
  # /opt/dtk, /opt/dtk-<version>, or a pinned snapshot directory.
  - id: rocprofv2
    kind: kernel-profiler
    priority: 100
    probe: >-
      for root in "${KDA_DTK_ROOT:-/opt/dtk}" /opt/dtk /opt/dtk-26.04
      /opt/dtk-26.04-DCC2602-0317; do [ -x "$root/rocprofiler/bin/rocprofv2" ] && exit 0; done;
      exit 1
    capabilities: [kernel_trace, counters, structured_export, reference_comparison]
    skills: [skills/hygon-profile]
  - id: rocprof
    kind: kernel-profiler
    priority: 90
    probe: >-
      for root in "${KDA_DTK_ROOT:-/opt/dtk}" /opt/dtk /opt/dtk-26.04
      /opt/dtk-26.04-DCC2602-0317; do [ -x "$root/rocprofiler/bin/rocprof" ] && exit 0; done;
      exit 1
    capabilities: [kernel_trace, counters, structured_export, reference_comparison]
    skills: [skills/hygon-profile]
  - id: hipprof
    kind: timeline-profiler
    priority: 80
    probe: >-
      for root in "${KDA_DTK_ROOT:-/opt/dtk}" /opt/dtk /opt/dtk-26.04
      /opt/dtk-26.04-DCC2602-0317; do [ -x "$root/hip/bin/hipprof" ] && exit 0; done;
      exit 1
    version_command: >-
      for root in "${KDA_DTK_ROOT:-/opt/dtk}" /opt/dtk /opt/dtk-26.04
      /opt/dtk-26.04-DCC2602-0317; do [ -x "$root/hip/bin/hipprof" ] && { "$root/hip/bin/hipprof" -h; exit $?; }; done; exit 1
    capabilities: [timeline, structured_export, reference_comparison]
    skills: [skills/hygon-profile]
  - id: rocsys
    kind: profiler-controller
    priority: 70
    probe: >-
      for root in "${KDA_DTK_ROOT:-/opt/dtk}" /opt/dtk /opt/dtk-26.04
      /opt/dtk-26.04-DCC2602-0317; do [ -x "$root/rocprofiler/bin/rocsys" ] && exit 0; done;
      exit 1
    capabilities: [session_control, selective_capture]
    skills: [skills/hygon-profile]
  - id: rocminfo
    kind: device-inspector
    priority: 50
    probe: >-
      for root in "${KDA_DTK_ROOT:-/opt/dtk}" /opt/dtk /opt/dtk-26.04
      /opt/dtk-26.04-DCC2602-0317; do [ -x "$root/hip/bin/rocminfo" ] && exit 0; done;
      exit 1
    capabilities: [device_architecture, runtime_agents]
    skills: [skills/hygon-profile]
  - id: rocm-smi
    kind: device-inspector
    priority: 40
    probe: >-
      for root in "${KDA_DTK_ROOT:-/opt/dtk}" /opt/dtk /opt/dtk-26.04
      /opt/dtk-26.04-DCC2602-0317; do [ -x "$root/bin/rocm-smi" ] && exit 0; done;
      exit 1
    capabilities: [device_state, clocks, memory, utilization]
    skills: [skills/hygon-profile]
  - id: hy-smi
    kind: device-inspector
    priority: 40
    probe: >-
      for path in /opt/hyhal/bin/hy-smi /opt/dtk/bin/hy-smi /opt/dtk-26.04/bin/hy-smi;
      do [ -x "$path" ] && exit 0; done; command -v hy-smi >/dev/null 2>&1
    capabilities: [device_state, clocks, memory, utilization]
    skills: [skills/hygon-profile]

capabilities:
  profilers: [rocprofv2, rocprof, hipprof]
  structured_profile_export: true
  reference_profile_comparison: true
  ai_profile_fallback: true
  low_level_artifacts: [triton-ir, llvm-ir, hsaco]

extensions:
  tle:
    status: experimental
    required: false
    skill: skills/tle-optimization
    project_marker: tle-wiki
    reason: >-
      Hygon TLE/TMA support is task- and runtime-dependent. It must pass a
      task-local Wiki/API probe before being enabled; profiling does not imply
      that TLE is available.

notes:
  - >-
    rocprofv2 is the preferred Hygon kernel profiler for gfx936. Use its
    kernel-trace CSV and optional counter export as structured evidence.
  - >-
    rocprof is the legacy v1 kernel profiler and can collect API/kernel traces
    and hardware counters. Its --list-basic probe succeeded in the current
    xiaodan-dev DTK image. Use it as a counter/trace alternative after a
    task-local capture smoke test; some DTK images have a stale path issue.
  - >-
    hipprof is the timeline profiler for launch gaps, synchronization, and
    host/device overlap. Use it for timeline questions or when a timeline is
    needed to explain end-to-end latency.
  - >-
    rocsys controls selective rocprofv2 sessions for long-running workloads;
    it is a session controller, not an independent trace or counter analyzer.
  - >-
    rocm-smi/hy-smi and rocminfo are device-state and architecture probes, not
    kernel profilers. Run them in preflight/profile setup to record clocks,
    memory, topology, and the active gfx target.
  - >-
    Use rocprofv2 as the default kernel profiler. Do not assume rocprof counter
    capture works merely because its binary and counters are visible; require a
    parseable task-local capture before using its metrics.
  - >-
    The validated BW/gfx936 reference image is Wave64 with 80 CU, 64 KiB
    group/LDS, 32 KiB L1, 8 MiB L2, and a 1024-work-item workgroup limit. Use
    these as launch constraints and re-probe them after a DTK or device change;
    they are not a performance model or H100-equivalent ratio.
  - >-
    Large D2D copies measured about 1.35 TB/s and N=8192 PyTorch FP16/BF16
    GEMM measured about 305 TFLOPS in one validated image. These are calibration
    anchors only, not HBM theoretical or native FP8 peak values.
  - >-
    rocprofv2 counter names may be listed while a task-local -i capture still
    produces no result file. Require a parseable counter export before making
    numeric VMEM, VALU, LDS, or occupancy claims; use kernel trace and HSACO
    evidence as the fallback.
  - >-
    Treat LDS tiling with software-managed double buffering as a testable
    optimization candidate for kernels with reusable tiles and enough compute
    to overlap loads. Do not equate it with TMA or a dedicated copy engine. The
    current gfx936 DTK/LLVM probe did not produce a direct global-to-LDS path;
    use the validated evidence and candidate gates in
    backends/hygon/note/gfx936-validation.md.
  - >-
    Route a measured bottleneck through backends/hygon/note/METHODS.md before
    choosing the next experiment, check backends/hygon/note/rejected/ so a
    previously rejected approach is not retried unchanged, and use
    backends/hygon/note/OPERATOR-PORTING.md when the operator is new to this
    device.
  - >-
    Exact profiler commands and their failure modes are recorded in
    backends/hygon/note/profiling-tools.md. On the validated 2026-11-03 image,
    rocprofv2 --kernel-trace produced a usable results_kernels.csv, rocprofv2 -i
    exited zero without writing a counter file, and rocprof v1 with pmc syntax
    produced the counter CSV. Route counters through v1, keep the trace path for
    timing, and never measure latency from a v1 replay run.
