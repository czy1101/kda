version: 1
id: hygon-gfx936

match:
  backend: hygon
  arches: [gfx936]
  devices: [BW, Hygon]
  languages: [triton, hip]

skills:
  always: []
  when_discovering:
    - skills/backend-profiler-discovery
  when_profiling:
    - skills/hygon-profile

analysis_tools:
  - id: rocprofv2
    kind: kernel-profiler
    priority: 100
    probe: >-
      test -x "${KDA_DTK_ROOT:-/opt/dtk-26.04-DCC2602-0317}/rocprofiler/bin/rocprofv2"
    version_command: >-
      "${KDA_DTK_ROOT:-/opt/dtk-26.04-DCC2602-0317}/rocprofiler/bin/rocprofv2"
      --help
    capabilities: [kernel_trace, counters, structured_export, reference_comparison]
    skills: [skills/hygon-profile]
  - id: hipprof
    kind: timeline-profiler
    priority: 80
    probe: >-
      test -x "${KDA_DTK_ROOT:-/opt/dtk-26.04-DCC2602-0317}/hip/bin/hipprof"
    version_command: >-
      "${KDA_DTK_ROOT:-/opt/dtk-26.04-DCC2602-0317}/hip/bin/hipprof" -h
    capabilities: [timeline, structured_export, reference_comparison]
    skills: [skills/hygon-profile]

capabilities:
  profilers: [rocprofv2, hipprof]
  structured_profile_export: true
  reference_profile_comparison: true
  ai_profile_fallback: true
  low_level_artifacts: [triton-ir, llvm-ir, hsaco]

extensions:
  tle:
    status: experimental
    required: false
    skill: skills/tle-optimization
    project_marker: tle-wiki
    reason: >-
      Hygon TLE/TMA support is task- and runtime-dependent. It must pass a
      task-local Wiki/API probe before being enabled; profiling does not imply
      that TLE is available.

notes:
  - >-
    rocprofv2 is the preferred Hygon kernel profiler for gfx936. Use its
    kernel-trace CSV and optional counter export as structured evidence.
  - >-
    hipprof is a timeline fallback for launch gaps, synchronization, and
    host/device overlap. Select it only when rocprofv2 is unavailable or when
    a timeline question is being investigated.
  - >-
    rocm-smi/hy-smi and rocminfo are device-state and architecture probes, not
    kernel profilers. Run them in preflight/profile setup to record clocks,
    memory, topology, and the active gfx target.
  - >-
    The legacy rocprof v1 command is not declared as a default tool because
    some DTK images resolve a stale /opt/dtk-26.04/rocminfo path. Re-enable it
    only after a task-local smoke test succeeds.
