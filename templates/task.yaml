# KDA Task Contract, version 1 - fill-in template.
#
# Usage:
#   mkdir -p <task-workspace>/.kernelpilot
#   cp templates/task.yaml <task-workspace>/.kernelpilot/task.yaml
#   edit the copy
#
# Validate the copy against schemas/task.schema.yaml.
#
# This file describes only WHAT the task is. It must not contain HOW to
# optimize: tiling, memory strategy, warp stalls, profiler interpretation, or
# DSL-specific advice belong in a Skill.

version: 1

task:
  name: <short-task-name>          # e.g. flash-kda
  description: <one-line goal>

target:
  backend: <cuda|gcu|ascend|kunlun>
  device: <H100|B200|gcu300|...>
  arch: <sm90|sm100|...>
  profile: <backend-profile-id>     # e.g. cuda-sm90
  language: <triton|cuda|tilelang|...>

# Codex remains on the controller. For a GPU server that cannot run Codex,
# choose ssh and point at the remote operator repository. Omit this block, or
# use transport: local, when the operator repository is local.
execution:
  transport: ssh
  host: <ssh-config-host>            # e.g. baai
  workspace: <absolute-remote-repository-path>

# Every contracted command runs in this shell after `setup`. Do not assume that
# an environment's Python path reproduces conda's library-path activation.
environment:
  shell: bash
  setup: |
    source <conda-root>/etc/profile.d/conda.sh
    conda activate <environment-name>
  preflight:
    command: python -c "import torch; print(torch.__version__, torch.cuda.get_device_name())"
    expect_stdout_contains: <expected-device-name>

implementation:
  path: <repository-relative path the agent may modify>
  entrypoint: <symbol or module the implementation is entered through>

reference:
  path: <repository-relative path of the reference implementation>

correctness:
  command: <command that proves correctness>
  required: true

benchmark:
  command: <command that measures the target metric>
  warmup: 20
  repeat: 100
  shapes:
    - <shape that must be covered, e.g. 1x8192x128>

# Keep the implementation general unless the task explicitly permits an
# algorithmically justified shape-dependent path. Do not expose private guard
# shapes when the evaluator intentionally keeps them hidden.
generalization:
  allow_shape_specialization: false
  # command: <optional generalization validation command>
  # guard_shapes:
  #   - <boundary or held-out shape>
  # max_regression: 0.02

# Select the comparison target before optimization. Use `original` when the
# candidate is judged against the unmodified implementation, or `reference`
# when it is judged against a separate high-performance implementation.
baseline:
  name: <original|reference|other-comparator-name>
  command: <command that measures the selected comparator>

# Optional. `tool: auto` selects only a profiler that is both declared by the
# backend profile and detected in this exact environment. Per-tool commands
# let the same task work when different profiler packages are installed.
profile:
  tool: auto
  # tools:
  #   <tool-id>:
  #     candidate_command: <capture a report for the current candidate>
  #     reference_command: <capture a comparable report for the reference>
  #     export_command: <export a report to structured text or CSV>
  # low_level_commands:
  #   ptx: <capture PTX>
  #   sass: <capture final machine instructions>

# `auto` uses only capabilities declared by the selected backend profile.
# `required` fails the analysis stage when the capability is unavailable.
# `disabled` bypasses that analysis path. Optional extensions are never assumed
# to exist merely because they are named here.
analysis:
  tool_discovery: auto
  preferred_tools: []              # optional task-specific order
  profiling: auto
  reference_profile_comparison: auto
  low_level_artifacts: auto
  ai_profile_fallback: true
  extensions:
    tle: disabled                    # default: this task does not involve TLE

# Used only when analysis.extensions.tle is changed to auto or required.
# The API probe must come from the project's tle-wiki; do not guess an import
# name or API that the installed TLE version may not provide.
extension_config:
  tle:
    wiki_path: tle-wiki
    # api_probe_command: <read-only TLE API availability check>

goal:
  metric: <latency|throughput|...>
  direction: minimize
  aggregation: <sum_ratio|mean_ratio|geomean_ratio|all|any>
  relative_to_baseline: 0.90        # 1.0 = equal; 0.90 = 10% lower latency
  max_regression: 0.02              # no required shape may regress by >2%
  # target_value: <absolute target, use instead of relative_to_baseline>

constraints:
  preserve_api: true
  preserve_correctness: true
  allowed_paths:
    - <path the agent may modify>
  forbidden_paths:
    - <reference, test, and benchmark paths the agent must not modify>

stop:
  max_candidates: 20
  max_profile_runs: 10
  no_improvement_rounds: 5
  target_reached: true
  reference_parity_tolerance: 0.02
  allow_no_actionable_bottleneck_exit: true
  allow_backend_capability_exhausted_exit: true
